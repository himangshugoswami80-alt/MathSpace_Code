services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: mathspace
      POSTGRES_USER: mathspace
      POSTGRES_PASSWORD: mathspace
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://mathspace:mathspace@postgres:5432/mathspace
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      - postgres

volumes:
  postgres_data:
